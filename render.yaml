services:
  - type: web
    name: neon-fuse-realtime
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: MULTIPLAYER_SECRET
        sync: false
      - key: MAX_REALTIME_CONNECTIONS
        value: 200
      - key: MAX_REALTIME_ROOMS
        value: 100
