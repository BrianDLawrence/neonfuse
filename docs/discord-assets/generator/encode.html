<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neon Fuse clip encoder</title>
  </head>
  <body>
    <script>
      // Turns the captured gameplay frames into an H.264 mp4, using Chrome's own
      // WebCodecs encoder and the small muxer below. This stands in for ffmpeg, so
      // the clip can be made without installing anything.

      const text = new TextEncoder();
      const u16 = (value) => new Uint8Array([(value >> 8) & 255, value & 255]);
      const u32 = (value) => new Uint8Array([(value >>> 24) & 255, (value >>> 16) & 255, (value >>> 8) & 255, value & 255]);
      const zeros = (count) => new Uint8Array(count);

      function join(...parts) {
        const out = new Uint8Array(parts.reduce((total, part) => total + part.length, 0));
        let offset = 0;
        for (const part of parts) {
          out.set(part, offset);
          offset += part.length;
        }
        return out;
      }

      const box = (type, ...parts) => {
        const body = join(...parts);
        return join(u32(body.length + 8), text.encode(type), body);
      };
      const fullBox = (type, version, flags, ...parts) => box(type, u32((version << 24) | flags), ...parts);
      const MATRIX = join(u32(0x10000), zeros(12), u32(0x10000), zeros(12), u32(0x40000000));

      /** One H.264 video track, every sample in a single chunk, moov before mdat. */
      function muxMp4({ samples, avcC, width, height, fps }) {
        const timescale = fps * 1000;
        const mediaDuration = samples.length * 1000;
        const movieDuration = Math.round((samples.length / fps) * 1000);
        const keyframes = samples.map((sample, index) => (sample.key ? index + 1 : 0)).filter(Boolean);
        const data = join(...samples.map((sample) => sample.data));

        const build = (chunkOffset) => {
          const avc1 = box(
            "avc1",
            zeros(6),
            u16(1),
            zeros(16),
            u16(width),
            u16(height),
            u32(0x00480000),
            u32(0x00480000),
            zeros(4),
            u16(1),
            zeros(32),
            u16(0x0018),
            u16(0xffff),
            box("avcC", avcC)
          );
          const stbl = box(
            "stbl",
            fullBox("stsd", 0, 0, u32(1), avc1),
            fullBox("stts", 0, 0, u32(1), u32(samples.length), u32(1000)),
            fullBox("stss", 0, 0, u32(keyframes.length), ...keyframes.map(u32)),
            fullBox("stsc", 0, 0, u32(1), u32(1), u32(samples.length), u32(1)),
            fullBox("stsz", 0, 0, u32(0), u32(samples.length), ...samples.map((sample) => u32(sample.data.length))),
            fullBox("stco", 0, 0, u32(1), u32(chunkOffset))
          );
          const minf = box(
            "minf",
            fullBox("vmhd", 0, 1, zeros(8)),
            box("dinf", fullBox("dref", 0, 0, u32(1), fullBox("url ", 0, 1))),
            stbl
          );
          const mdia = box(
            "mdia",
            fullBox("mdhd", 0, 0, zeros(8), u32(timescale), u32(mediaDuration), u16(0x55c4), u16(0)),
            fullBox("hdlr", 0, 0, zeros(4), text.encode("vide"), zeros(12), text.encode("VideoHandler\0")),
            minf
          );
          const tkhd = fullBox(
            "tkhd",
            0,
            7,
            zeros(8),
            u32(1),
            zeros(4),
            u32(movieDuration),
            zeros(8),
            zeros(8),
            MATRIX,
            u32(width << 16),
            u32(height << 16)
          );
          const mvhd = fullBox(
            "mvhd",
            0,
            0,
            zeros(8),
            u32(1000),
            u32(movieDuration),
            u32(0x10000),
            u16(0x0100),
            zeros(10),
            MATRIX,
            zeros(24),
            u32(2)
          );
          return box("moov", mvhd, box("trak", tkhd, mdia));
        };

        const ftyp = box("ftyp", text.encode("isom"), u32(0x200), text.encode("isomiso2avc1mp41"));
        const moov = build(ftyp.length + build(0).length + 8);
        return join(ftyp, moov, box("mdat", data));
      }

      async function pickCodec(config) {
        // High, then Main, then Baseline, all at a level that covers 640x360.
        for (const codec of ["avc1.64001f", "avc1.4d401f", "avc1.42001f"]) {
          const { supported } = await VideoEncoder.isConfigSupported({ ...config, codec });
          if (supported) return codec;
        }
        return null;
      }

      /** `frames` holds one image URL per output frame; repeats reuse the image already drawn. */
      window.encodeClip = async ({ frames, fps, width, height, bitrate }) => {
        if (typeof VideoEncoder === "undefined") return { error: "no-h264" };

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingQuality = "high";

        const config = {
          width,
          height,
          bitrate,
          framerate: fps,
          bitrateMode: "variable",
          latencyMode: "quality",
          avc: { format: "avc" }
        };
        const codec = await pickCodec(config);
        if (!codec) return { error: "no-h264" };

        const samples = [];
        let avcC = null;
        let failure = null;
        const encoder = new VideoEncoder({
          output(chunk, metadata) {
            const description = metadata?.decoderConfig?.description;
            if (description && !avcC) {
              avcC = ArrayBuffer.isView(description)
                ? new Uint8Array(description.buffer, description.byteOffset, description.byteLength).slice()
                : new Uint8Array(description).slice();
            }
            const data = new Uint8Array(chunk.byteLength);
            chunk.copyTo(data);
            samples.push({ data, key: chunk.type === "key", timestamp: chunk.timestamp });
          },
          error(error) {
            failure = error;
          }
        });
        encoder.configure({ ...config, codec });

        const total = frames.length;
        let shown = null;
        for (let index = 0; index < total; index += 1) {
          if (frames[index] !== shown) {
            const image = await createImageBitmap(await (await fetch(frames[index])).blob());
            ctx.drawImage(image, 0, 0, width, height);
            image.close();
            shown = frames[index];
          }
          const frame = new VideoFrame(canvas, {
            timestamp: Math.round((index * 1e6) / fps),
            duration: Math.round(1e6 / fps)
          });
          encoder.encode(frame, { keyFrame: index % (fps * 5) === 0 });
          frame.close();
          while (encoder.encodeQueueSize > 4) await new Promise((resolve) => setTimeout(resolve, 5));
          if (failure) throw failure;
        }
        await encoder.flush();
        encoder.close();
        if (failure) throw failure;
        if (!avcC || samples.length !== total) throw new Error(`The encoder returned ${samples.length} of ${total} frames.`);
        // The muxer writes no composition offsets, so frames must arrive in display order.
        if (samples.some((sample, index) => index > 0 && sample.timestamp <= samples[index - 1].timestamp)) {
          throw new Error("The encoder reordered frames (B-frames), which this muxer does not write.");
        }

        const file = muxMp4({ samples, avcC, width, height, fps });
        let binary = "";
        for (let offset = 0; offset < file.length; offset += 0x8000) {
          binary += String.fromCharCode(...file.subarray(offset, offset + 0x8000));
        }
        return { codec, bytes: file.length, frames: samples.length, base64: btoa(binary) };
      };

      /** Opens a finished clip in Chrome's own player and reports what it sees. */
      window.probeClip = async (src) => {
        const video = document.createElement("video");
        video.muted = true;
        video.preload = "auto";
        video.src = src;
        await new Promise((resolve, reject) => {
          video.addEventListener("loadeddata", resolve, { once: true });
          video.addEventListener("error", () => reject(new Error("The clip does not play.")), { once: true });
        });
        return { width: video.videoWidth, height: video.videoHeight, duration: video.duration };
      };
    </script>
  </body>
</html>
